<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inlined as a data URI rather than a file, so the icon resolves whatever
      sub-path the static build is served from — and so the page makes no
      requests at all beyond its own bundle.
    -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232f6d5f'/%3E%3Crect x='6' y='9' width='20' height='14' rx='1.5' fill='%23fff'/%3E%3Crect x='9' y='13' width='14' height='2' fill='%232f6d5f'/%3E%3Crect x='11' y='17.5' width='10' height='1.5' fill='%23a8a6a1'/%3E%3C/svg%3E"
    />
    <title>Plaque — Place Card Pipeline</title>
    <meta
      name="description"
      content="Turn a guest CSV into print-ready place card PDFs. Runs entirely in your browser."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
